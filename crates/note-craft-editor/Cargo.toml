[package]
name = "note-craft-editor"
version = "0.1.0"
edition = "2021"
authors = ["Note Craft Team"]
description = "Markdown editor component for Note Craft"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["note-craft", "markdown", "editor"]
categories = ["text-editors", "parsing"]

[dependencies]
# Workspace dependencies
note-craft-core = { path = "../note-craft-core" }
serde = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

# Markdown parsing
pulldown-cmark = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }

[features]
default = []
