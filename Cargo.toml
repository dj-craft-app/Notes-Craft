[workspace]
members = [
    "crates/note-craft-core",
    "crates/note-craft-editor",
    "crates/note-craft-storage",
    "crates/note-craft-ui",
    "crates/note-craft-plugins",
    "crates/note-craft-query",
]
resolver = "2"

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"

# Datalog engine (decision actee v0.2.0-datalog-decision)
datafrog = "2.0.1"

# Markdown parsing
pulldown-cmark = { version = "0.9", features = ["simd"] }

# Syntax highlighting
syntect = { version = "5.0", default-features = false, features = ["default-fancy"] }

# Storage
rusqlite = { version = "0.30", features = ["bundled"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# UI
slint = "1.3"

# WebView
wry = "0.30"

# WASM for plugins (will be added in Phase 6)
# wasmtime = "14.0"

# Configuration formats
toml = "0.8"
serde_yaml = "0.9"

# Encoding
base64 = "0.21"

# File system utilities
pathdiff = "0.2"
tempfile = "3.8"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Testing
tokio-test = "0.4"

# Parsing
regex = "1.10"
quick-xml = { version = "0.31", features = ["serialize"] }

# UUID
uuid = { version = "1.4", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.bench]
inherits = "release"
debug = true
