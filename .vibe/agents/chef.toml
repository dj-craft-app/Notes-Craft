# =====================================================================
# AGENT "CHEF" — orchestrateur global (tous projets)
# Emplacement : ~/.vibe/agents/chef.toml
# =====================================================================

# Type : "agent" = visible et sélectionnable (--agent chef, Shift+Tab)
agent_type = "agent"

# Nom affiché dans le label du mode, sous la zone de saisie
display_name = "Chef d'orchestre"

# Résumé de l'agent, affiché dans les listes. Information pour TOI
description = "Orchestrateur : planifie, découpe, délègue en vagues, agrège."

# Indicateur visuel uniquement : NE restreint RIEN
safety = "neutral"

# Modèle de CET agent quand il est actif (écrase active_model de config.toml)
active_model = "zai-glm-5-3"

# Charge automatiquement ~/.vibe/prompts/chef.md (ou .vibe/prompts/ du projet,
# qui PRIME dans Note-Craft)
system_prompt_id = "chef"

# Allow-list d'outils : le chef délègue l'écriture à dev-rust ; il n'édite
# jamais lui-même (règle chef.md). write_file/edit sont requis dans le profil
# parent pour que dev-rust (subagent) en hérite.
enabled_tools = ["read_file", "edit", "write_file", "bash", "skill"]

[tools.bash]
permission = "ask"
allowlist = ["ls*", "cat *", "grep*", "rg*", "git status", "git log*", "git diff*"]

[tools.read_file]
permission = "always"

# Tripwire : si le chef tente lui-même d'écrire, la session te demandera.
# Refuse systématiquement : l'écriture est réservée à dev-rust.
[tools.write_file]
permission = "ask"

[tools.edit]
permission = "ask"
