name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          components: rustfmt, clippy
          
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
            
      - name: Format check
        run: |
          for crate in note-craft-core note-craft-editor note-craft-plugins note-craft-query note-craft-storage; do
            (cd crates/$crate && cargo fmt --check) || exit 1
          done
        
      - name: Clippy check
        run: cargo clippy --all-targets --exclude note-craft-ui -- -D warnings
        
      - name: Build
        run: cargo build --verbose --exclude note-craft-ui
        
      - name: Run tests
        run: cargo test --verbose --exclude note-craft-ui
